; nozzle-threshold between the centres of the last two cells (x = 1.5 and 2.5): with sx the last row, upstream
; of it, is the plenum and rows 1 and 2 take the nozzle law. ICB used to write the row after the first cell
; past the threshold, here past the arrays: a Bus error on macOS.
[ICB-Block1]
type = nozzle
p0 = 5.0e5
T0 = 450.0
nozzle-threshold = 2.0
nozzle-direction = sx
