; nozzle-threshold between the centres of the last two cells (x = 1.5 and 2.5): the first cell past it is the
; last cell of the block, and the row after it lies outside the block. ICB wrote that row past the arrays
; (the plenum rows with nozzle-direction = dx, the nozzle law with sx): a Bus error on macOS.
[ICB-Block1]
type = nozzle
p0 = 5.0e5
T0 = 450.0
nozzle-threshold = 2.0
nozzle-direction = sx
