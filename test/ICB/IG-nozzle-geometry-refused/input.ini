; The nozzle law needs a nozzle: a duct about the x axis meshed along it (i from inlet to exit, j from the
; axis or the inner wall to the outer wall) whose cross-section varies, with a throat. Each mesh of this
; directory is not one, and ICB stops before writing anything:
;   box.tec      a quarter annulus of constant section (legge_aree stopped on it with a Fortran backtrace);
;   flat.tec     a 2-D channel from y = -r to y = r: its walls lie at the same distance from the x axis,
;                every row has no cross-section (the law divided by a zero throat area);
;   reversed.tec the nozzle of IG-nozzle-area-law with i running towards -x.
[ATLAS-Parameters]
IC-format = tec

[ICB-Block1]
type = nozzle
p0 = 500000.0
T0 = 450.0
yO2 = 0.25
yN2 = 0.75
