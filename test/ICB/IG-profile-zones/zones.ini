; A zone given by a 1-D profile needs the table over its own range only: lo.dat spans x from 0 to 0.5,
; the range of zone lo. ICB read the table at every cell of the block and stopped on the cells of zone hi.
[ICB-Block1]
direction = x
zone1 = lo
range1 = 0.0 0.5
zone2 = hi
range2 = 0.5 1.0

[lo]
p = 1.0e5
T-file = lo.dat
T-direction = x
yO2 = 0.233
yN2 = 0.767

[hi]
p = 1.0e5
T = 300.0
yO2 = 0.233
yN2 = 0.767
