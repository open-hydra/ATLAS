; The solid block (block 2 of the IG+SP mesh) split along x and i: zone cold takes x < 0, zone hot x > 0,
; both over every i. The solid writer compared the index letters only when the direction mixed the two
; kinds, so hot, written last, took every cell.
[ICB-Block1]
phase = gas
p = 1.0e5
T = 300.0

[ICB-Block2]
phase = solid
direction = xi
zone1 = cold
range1 = -1.0 0.0 1 50
zone2 = hot
range2 = 0.0 1.0 1 50

[cold]
T = 300.0

[hot]
T = 600.0
