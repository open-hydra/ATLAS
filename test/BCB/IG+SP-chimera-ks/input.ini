; coupled-phases-ks with the interface found by the overset search: both sides of
; the gas/plate interface are declared chimera, the gas one with a uniform wall
; roughness, ks = 1.0e-5 m.
;
; The donors of every interface facelet belong to the other phase, so BCB writes
; type 104 instead of 102.  Being a fluid (ideal-gas) phase, the gas writes the
; roughness at the end of the donor-count line of each 104 record, as it does at
; the end of a 103 record; the solid phase has no use for it and writes nothing.
;
; Expected: 24 gas and 24 plate 104 records, every gas donor-count line ending in
; 1.0000000000000001E-05, every plate one holding the two counts only.

[ATLAS-Parameters]
BC-chimera = true

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = rough_chimera
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = chimera
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[rough_chimera]
type = chimera
ks   = 1.0e-5

[T_plate]
type = wall
T = 393.0
