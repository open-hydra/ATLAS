; An L-shaped wall around the corner of a channel, as in the hydra-AF cooling
; channel cases: one gas block (y, z in [0, 1.5] mm) and three plate blocks, S1
; under it, S2 in the corner, S3 beside it. Gas faces 4 and 6 and the facing S1
; and S3 faces are declared chimera, on non-conforming meshes.
;
; The ghost cells of the S1 and S3 rows along the corner touch S2, a block of
; their own phase, with zero volume: no S2 cell is a donor. The record must stay
; 104, like the rest of the interface; a test of phase that also counted the
; zero-volume intersections turned those rows into 102, chimera inside the solid
; with gas donors, and left the gas faces in front of them without a partner.
;
; Expected: 36 gas and 24 plate 104 records, no 102, every donor inside a block
; of the other phase (check-coupling.py).

