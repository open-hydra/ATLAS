; IG-2D-grain-inflow: a solid-propellant grain (gsi, BC 502) on a 2D mesh (x,y file, IG-2D-inlet-408-refused's),
; which Q2D reads, in both modes: grain-bc = inflow writes the 502 records of mode 2 with the turbulence variable of
; the section (nuTilde) after the mass fraction of O2. _run-rsm: inflow with Rij and omega: the 5 bands of an inflow
; of Q2D (R11 R22 R33 R12 omega); _run-wall: the grain as a wall (grain-bc's default), mode 1, no turbulence
; variable although the deck gives nuTilde; _run-noturb: nrans = 1 in place of nuTilde, the band written as 0 with
; the WARNING of the inlets 401-404. check_2d.py checks the 502 line of every cell of face 1.

[BCB-Block1]
face1 = grain
face2 = outflow
face3 = symmetry
face4 = symmetry

[outflow]
type = outlet
p = 1.0d+5

[grain]
type     = gsi
a        = 0.0052
n        = 0.35
pRef     = 4.829e6
rhoGrain = 1750.0
grain-bc = inflow
nuTilde  = 1.5e-5
