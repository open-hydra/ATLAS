; DP-gsi-grain-flow: the gas flow of a solid-propellant grain (gsi, BC 502) that injects dispersed phases.
; IG-ablation's mesh with its gas phase and two dispersed phases: drop (DP-basic's: one material, one population)
; and ash (DP-population-list's: alumina in two populations and water in one, three pairs). The grain gives every
; (material, population) pair of every phase entering through it the fraction krho of its flow and the gas the
; rest: gas-bc.txt's a = 0.0052 x (1 - krho_tot).
;   face 3, [grain-drop]: drop only, krho_tot = 0.2                     -> a = 0.0052 x 0.8; ash-bc.txt 300
;   face 4, [grain-both]: drop 0.2 and ash 0.05 0.1 0.02 (one per pair) -> a = 0.0052 x 0.63; ash-bc.txt 401,
;                         one krho per copy of its table
; check_flows.py checks the three files. _run-full: ash-krho = 0.4 0.3 0.2, krho_tot 1.1 on face 4, refused;
; _run-gp: drop-gp in [grain-drop] instead of drop-krho (a mass flux: BC 403, gp without Vp), refused.

[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = grain-drop
face4 = grain-both

[grain-drop]
type      = gsi
a         = 0.0052
n         = 0.35
pRef      = 4.829e6
rhoGrain  = 1750.0
yO2       = 0.7
yH2       = 0.3
drop-krho = 0.2
drop-dp   = 2.0e-5

[grain-both]
type      = gsi
a         = 0.0052
n         = 0.35
pRef      = 4.829e6
rhoGrain  = 1750.0
yO2       = 0.7
yH2       = 0.3
drop-krho = 0.2
drop-dp   = 2.0e-5
ash-krho  = 0.05 0.1 0.02
ash-dp    = 1.0e-5
