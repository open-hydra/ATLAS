; DP-gsi-keys-refused: an inlet key of the dispersed phase drop on a face of the 500 family that does not inject it.
; DP-gsi-manifold's deck with drop-krho in [abl], the surface-reactions patch (505): BCB stops with the key, the
; section, the BC and the face's role for drop, and writes no drop-bc.txt. With strict-keys = false the key is
; reported once (the patch is built cell by cell) and the files are DP-gsi-manifold's. The same key in [man], the
; manifold (501), is refused alike.

[ATLAS-Parameters]
strict-keys = true

[BCB-Block1]
face1 = man
face2 = symmetry
face3 = bottom
face4 = top

[bottom]
direction = i
patch1 = grain-drop
range1 = 1 25
patch2 = grain-gas
range2 = 26 50

[top]
direction = i
patch1 = melt
range1 = 1 12
patch2 = pyro
range2 = 13 25
patch3 = abl
range3 = 26 37
patch4 = pyrabl
range4 = 38 50

[man]
type  = manifold
block = 1
face  = 2

[grain-drop]
type      = gsi
a         = 0.0052
n         = 0.35
pRef      = 4.829e6
rhoGrain  = 1750.0
grain-wall = T
yO2       = 0.7
yH2       = 0.3
drop-krho = 0.2
drop-kV   = 0.9
drop-kT   = 1.0
drop-dp   = 2.0e-5

[grain-gas]
type     = gsi
a        = 0.0052
n        = 0.35
pRef     = 4.829e6
rhoGrain = 1750.0
grain-wall = T
yO2      = 0.7
yH2      = 0.3

[melt]
type = gsi
cp   = 1000.0
Ti   = 300
dh   = -500
T    = 500
qrad = 10000
yH2  = 0.3
yO2  = 0.7

[pyro]
type            = gsi
pyrolysis-model = HTPB
qrad            = 10000
yH2             = 0.3
yO2             = 0.7

[abl]
type              = gsi
surface-reactions = bradley
qrad              = 1.0e6
drop-krho         = 0.2

[pyrabl]
type              = gsi
pyrolysis-model   = HTPB
surface-reactions = bradley
qrad              = 10000
yH2               = 0.3
yO2               = 0.7
