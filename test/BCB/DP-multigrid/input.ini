; A dispersed phase on three multigrid levels.
;
; write_dp_bc used to ignore the level it was called with and always open
; <prefix>bc.txt, so a run with MG-levels > 1 rewrote the same file once per
; level and left the fine table replaced by the coarse one, padded with NULs to
; the old length. This case pins the fix: one file per level, each holding that
; level's boundary table.
;
; The phase has two materials and alumina carries two populations, so every
; level holds three copies of its table -- the layout write_dp_bc produces by
; looping materials and populations inside the block loop.
;
; Expected: drop-bc.txt, drop-bc2.txt and drop-bc3.txt, with 3840, 960 and 240
; records.

[ATLAS-Parameters]
MG-levels = 3

[BCB-Block1]
face1 = injector
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = out
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[injector]
type = inlet
drop-gp = 345.0
drop-Tp = 450
drop-Vp = 100.0
drop-alphap = 26.0
drop-dp = 0.01
drop-sigmap = 0.0
drop-distribution = Normal

[wall]
type = wall
q = 0.0

[out]
type = outlet
p = 1.0
