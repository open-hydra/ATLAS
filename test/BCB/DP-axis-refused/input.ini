[BCB-Block1]
face1 = inj
face2 = extrapolation
face3 = ax
face4 = noz

; Axis (the j-min face of this 2Daxi mesh sits at r 0). Only outlet or symmetry may
; override it for a dispersed phase: wall is refused, BCB stops before writing.
[ax]
type       = axisymmetric
partL-type = wall

; Nozzle contour: slip wall for the gas (300, no q or T), trap wall for the particles (301).
[noz]
type = wall

[inj]
type = inlet
p0 = 3.0e+5
T0 = 500.0
partL-krho = 0.5 0.1
partL-kT = 0.89 0.756
partL-dp = 10e-6 200e-6
