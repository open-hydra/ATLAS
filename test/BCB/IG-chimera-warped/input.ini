; Two overlapping blocks of a twisted annular sector (make_mesh.py): every cell
; is warped, its faces of constant j are helicoids. Block 2's face 1 and block
; 1's face 2 are declared chimera; the other faces are symmetry.
;
; The exact face-face intersection is ill-conditioned on these cells: it fails
; the closure of every fully covered receiver and drops donors of weight up to
; 0.8. BCB recomputes them by clipping the cells split into tetrahedra (chimera.log:
; "Volumes by clipping"), which must close every receiver whose nodes are all
; covered. Some ghost cells reach only 0.6% and 2.4% of their thickness into a
; donor: those thin donors must stay in the list (a 6x6x6 sampling of the
; receiver missed 400 of them).

[ATLAS-Parameters]
BC-chimera = true

[BCB-Block1]
face1 = symmetry
face2 = chimera
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = chimera
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry
