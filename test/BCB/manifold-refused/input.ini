; manifold-refused: the deck of manifold-groups, which run.sh edits into one bad form at a time (variants.txt): a
; face naming a manifold section that lists it in neither role, a listed face that does not name the section, a
; face in both lists, a missing list, a pair that is not block:face, a face outside 1-6, K < 0, rf outside (0, 1].
; Each stops BCB with exit 1 and a message naming the section (and the face or the key); nothing is written.

[BCB-Block1]
face1 = merge
face2 = turn
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = merge
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = turn
face2 = merge
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[turn]
type       = manifold
outlet     = 1:2
inlet      = 3:1
K          = 0.5
rf         = 0.8
mdot-ratio = 0.5
p0-ratio   = 0.9
dh0        = 1.5e5

[merge]
type   = manifold
outlet = 2:2, 3:2
inlet  = 1:1
