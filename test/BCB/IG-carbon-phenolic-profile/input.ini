; IG-carbon-phenolic-profile: the 506 wall of IG-carbon-phenolic with phi and hv0 given along x by phi-file and
; hv0-file (two points each, x 0 and 1: a linear law over the face). check_profile.py holds every record of face 4 to
; the law at its cell centre x 0.01, 0.03, ... 0.99.

[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = wall

[wall]
type              = gsi
surface-reactions = bradley
pyrolysis-gas     = MX4926
direction         = x
phi-file          = phi.dat
hv0-file          = hv0.dat
qrad              = 1.0e6
eps               = 0.85
