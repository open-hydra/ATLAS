; DP-gsi-manifold: a dispersed phase (drop) on the faces of the 500 family.
; IG-ablation's mesh (one block, 50 x 20 cells, one layer) with the gas phase of IG-ablation and the
; dispersed phase of DP-basic. Face 1 is a manifold drawing on face 2; faces 3 and 4 are split along i into
; one patch per gsi variant: the solid-propellant grain (502) with and without inlet keys of drop, melting
; (503), pyrolysis (504), surface reactions (505), pyrolysis + surface reactions (506).
; drop-bc.txt: 300 on the manifold and on every gsi patch but the grain with drop's keys, which injects drop
; as an inlet does (401 from drop-krho, drop-kV, drop-kT, drop-dp). gas-bc.txt: the fluid's records as without drop,
; but the grain with drop's keys, whose a is 0.0052 x (1 - 0.2): drop takes 0.2 of the propellant's flow.

[BCB-Block1]
face1 = man
face2 = symmetry
face3 = bottom
face4 = top

[bottom]
direction = i
patch1 = grain-drop
range1 = 1 25
patch2 = grain-gas
range2 = 26 50

[top]
direction = i
patch1 = melt
range1 = 1 12
patch2 = pyro
range2 = 13 25
patch3 = abl
range3 = 26 37
patch4 = pyrabl
range4 = 38 50

[man]
type  = manifold
block = 1
face  = 2

[grain-drop]
type      = gsi
a         = 0.0052
n         = 0.35
pRef      = 4.829e6
rhoGrain  = 1750.0
yO2       = 0.7
yH2       = 0.3
drop-krho = 0.2
drop-kV   = 0.9
drop-kT   = 1.0
drop-dp   = 2.0e-5

[grain-gas]
type     = gsi
a        = 0.0052
n        = 0.35
pRef     = 4.829e6
rhoGrain = 1750.0
yO2      = 0.7
yH2      = 0.3

[melt]
type = gsi
cp   = 1000.0
Ti   = 300
dh   = -500
T    = 500
qrad = 10000
yH2  = 0.3
yO2  = 0.7

[pyro]
type            = gsi
pyrolysis-model = HTPB
qrad            = 10000
yH2             = 0.3
yO2             = 0.7

[abl]
type              = gsi
surface-reactions = bradley
qrad              = 1.0e6

[pyrabl]
type              = gsi
pyrolysis-model   = HTPB
surface-reactions = bradley
qrad              = 10000
yH2               = 0.3
yO2               = 0.7
