# Injector nozzle from the area ratio (BC 420). Calorically perfect gas (thermo.dat, gamma = 1.4,
# 1-1000 K: the table must cover the expansion down to the supersonic exit state, ~137 K here).
# Oracle = the tabulated-cp isentrope on the solvers' 1 K grid (linear cp/h interpolation, trapezoidal
# isentrope), 30-digit replica: psub = 960849.238033237, psup = 63984.7226583482, g = 933.329970316406
# (M_sub = 0.2395425, M_sup = 2.4427531). The closed-form area-Mach values (psub/p0 = 0.960849,
# psup/p0 = 0.063984, g = 933.3313) differ from them by the quadrature bias of the grid (<= 6e-6).
# Ae_At = 2.5 lies beyond the breakdown of the old subsonic Newton start (psub = psup was written).
[BCB-Block1]
face1 = inflow
face2 = symmetry
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
mit = 1d-6
Ae_At = 2.5
p0 = 10.0e5
T0 = 300.0
