; IG-2D-grain-inflow-refused: a solid-propellant grain (gsi, BC 502) with grain-bc = inflow on a 2D mesh (x,y file,
; IG-2D-inlet-408-refused's), which Q2D reads: Q2D applies a grain as the wall that blows the products in alone, so
; BCB stops and writes nothing. _run-wall: the same grain with grain-bc = wall (the default) writes its 502
; records, mode 1, without turbulence variables (the deck gives nuTilde).

[BCB-Block1]
face1 = grain
face2 = outflow
face3 = symmetry
face4 = symmetry

[outflow]
type = outlet
p = 1.0d+5

[grain]
type     = gsi
a        = 0.0052
n        = 0.35
pRef     = 4.829e6
rhoGrain = 1750.0
grain-bc = inflow
nuTilde  = 1.5e-5
