; DP-mixture-401: the mixture rule of the 401 inlet across the dispersed phases of a cell. DP-two-phases' mesh and
; phases partE, partL and a third, partG. [injCH4] gives partE krho 0.2 and partL krho 0.3 (401) and partG a mass
; flux gp 7.0 (402): the 401 records carry krho/(1 - krho_tot) = 0.2/0.5 and 0.3/0.5 and G = 7.0 last, partG's 402
; record gp 7.0 without G. [injOX] gives no key of any phase: 401 with krho 0 and G 0 in the three files (check_mix.py).
; _run-sum: partE 0.6 and partL 0.5, a sum of 1.1, stops BCB; _run-neg: partE -0.1 stops BCB.

[BCB-Block1]
face1 = adiabatic
face2 = out
face3 = symmetry
face4 = isoth

[BCB-Block2]
face1 = injOX
face2 = connection
face3 = symmetry
face4 = adiabatic

[BCB-Block3]
face1 = injCH4
face2 = connection
face3 = adiabatic
face4 = adiabatic

[injCH4]
type = inlet
partE-krho = 0.20
partL-krho = 0.30
partE-kV = 0.80
partL-kV = 0.80
partG-gp = 7.0
partG-Vp = 50.0

[injOX]
type = inlet

[adiabatic]
type = wall
q = 0.0

[isoth]
type = wall
T = 2000

[out]
type = outlet
p = 1.0
