; IG-carbon-phenolic: BC 506, the pyrolysing ablator (a gsi section with surface-reactions, pyrolysis-gas and qrad),
; on the mesh and the unnamed phase of IG-ablation. Face 4 is the 505 wall of IG-ablation plus the pyrolysis gas of
; the table MX4926, the second table of pyrolysis.dat (the fixture of DP-gsi-manifold): pyro_id 2. The reference is
; the bc.txt of IG-ablation with the code 506 and the payload pyro_id, surf, phi, hv0, qrad, eps on face 4.

[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = wall

[wall]
type              = gsi
surface-reactions = bradley
pyrolysis-gas     = MX4926
phi               = 0.247342
hv0               = -8.44e5
qrad              = 1.0e6
eps               = 0.85
