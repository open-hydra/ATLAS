; DP-population-list with its values written in other forms that the per-population reader
; (get_population_reals: list-directed input, token by token) reads as the same numbers: a comma
; or a slash after a value, a repeat count 1*v, and 3*v as the whole value (one value for every
; population). The BC file must be DP-population-list's.
[BCB-Block1]
face1 = injector
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = out
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[injector]
type = inlet
drop-gp = 3*345.0
drop-Tp = 450, 460, 470
drop-Vp = 100.0,
drop-alphap = 1*26.0
drop-dp = 0.01/ 0.02, 0.03,
drop-sigmap = 0.0
drop-distribution = Normal

[wall]
type = wall
q = 0.0

[out]
type = outlet
p = 1.0
