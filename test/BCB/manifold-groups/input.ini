; manifold-groups: two manifolds (BC 501) on the three-block mesh of MDB/manifold-split (48 x 8 x 8, 16 x 8 x 8,
; 16 x 8 x 8 cells).
;
; [turn]  joins face 2 of block 1 (outlet: the gas leaves the domain there) to face 1 of block 3 (inlet), with a
;         loss K, a relaxation factor and the three ratios of a lumped link given.
; [merge] joins two outlets, face 2 of block 2 and face 2 of block 3, to one inlet, face 1 of block 1, at the
;         defaults (a loss-free plenum, nothing taken out).
;
; The groups are numbered in the order the faces are built: block 1 face 1 names [merge] first (group 1), block 1
; face 2 [turn] (group 2). Every record of a group carries the same payload: gid, role (1 outlet, 2 inlet), K, rf,
; mdot-ratio, p0-ratio, dh0. check_manifold.py pins the seven fields per face; reference/bc.txt is the whole file.

[BCB-Block1]
face1 = merge
face2 = turn
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = merge
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = turn
face2 = merge
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[turn]
type       = manifold
outlet     = 1:2
inlet      = 3:1
K          = 0.5
rf         = 0.8
mdot-ratio = 0.5
p0-ratio   = 0.9
dh0        = 1.5e5

[merge]
type   = manifold
outlet = 2:2, 3:2
inlet  = 1:1
