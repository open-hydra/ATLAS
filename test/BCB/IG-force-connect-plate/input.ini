; injection plate with holes, the designed use of BC-force-connect (default T, not set here): the whole plate
; (block 1 face 1) is declared inlet [plate]; the cells that coincide with the hole blocks 2 and 3 are written as
; connections (101), the other cells keep the inlet. No multipatch is needed.
[BCB-Block1]
face1 = plate
face2 = outflow
face3 = adia
face4 = adia

[BCB-Block2]
face1 = feed
face2 = connection
face3 = adia
face4 = adia

[BCB-Block3]
face1 = feed
face2 = connection
face3 = adia
face4 = adia

[adia]
type = wall
q = 0.0

[outflow]
type = outlet
p = 1.0d+5

[plate]
type = inlet
T0 = 650.0
p0 = 2.5e6
yO2 = 0.25
yCH4 = 0.75

[feed]
type = inlet
T0 = 300.0
p0 = 3.0e6
yO2 = 0.5
yCH4 = 0.5
