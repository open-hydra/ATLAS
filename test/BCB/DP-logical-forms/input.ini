; DP-population-list with the logical keys of [ATLAS-Parameters] written in forms that FiNeR's
; get reads as their value (list-directed input: the first item counts): one dot, a comment after
; '#' or '!', a TAB or a comma after the value. They are the defaults, so the BC file must be
; DP-population-list's.
[ATLAS-Parameters]
strict-keys = T ! the default
BC-force-connect = .true # the default
BC-chimera = F	
BC-force-chimera = false,

[BCB-Block1]
face1 = injector
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = out
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[injector]
type = inlet
drop-gp = 345.0
drop-Tp = 450 460 470
drop-Vp = 100.0
drop-alphap = 26.0
drop-dp = 0.01 0.02 0.03
drop-sigmap = 0.0
drop-distribution = Normal

[wall]
type = wall
q = 0.0

[out]
type = outlet
p = 1.0
