; IG-chimera's deck with BC-chimera written T#note: a comment attached to a value that is not
; the default. FiNeR's get reads the first item of the value, so the BC file must be IG-chimera's.
[ATLAS-Parameters]
BC-chimera = T#note

[BCB-Block1]
face1 = symmetry
face2 = symmetry
face3 = symmetry
face4 = chimera 

[BCB-Block2]
face1 = symmetry
face2 = symmetry
face3 = chimera
face4 = symmetry
