; Air as a frozen mixture with Cantera transport, the gas of the hydra JPL nozzle cases.
; The mixture zone of the transport table must hold air, not the last pure species of the mixture.
[GPB-Phase1]
type      = ideal-gas
name      = gas
mixture   = {N2: 75.4} {O2: 23.3} {Ar: 1.3}
thermo    = NASA9
transport = cantera
Tmax      = 1000
