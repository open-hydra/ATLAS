description: |-
  Test mechanism with carbon monoxide (CO) and cobalt (Co), two NASA species whose names differ only in case: the species and the
  reaction of test/GPB/IG-transport-CEA-species-without-data/tiny-notr.yaml, and CO and Co with their records of
  database/thermo/nasa9.yaml.
phases:
  - name: tiny-co-cobalt
    kinetics: gas
    thermo: ideal-gas
    elements: [H, O, C, Co]
    species: [H2, O2, H2O, CO, Co]
    state:
      T: 300.0
      P: 1 atm
species:
  - name: H2
    composition: {H: 2.0}
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 1000.0, 3500.0]
      data:
