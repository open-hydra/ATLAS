; PY-carbon-phenolic: the pyrolysis-gas tables of a carbon-phenolic ablator (BC 506): makeup C/H/O 0.60957/0.10710/0.28333
; on the gas list H C2H4 OH CO CO2 H2 H2O O2 O C2H2,acetylene N2 (N2 holds an element the makeup has not: not in the table).
; The species come from the CEA run of species.inp (only its species list is used); one table per treatment.

[GPB-Phase1]
name      = gas
type      = ideal-gas
CEA-file  = species.inp
thermo    = NASA9
transport = CEA
Tmin      = 200
Tmax      = 4000

[GPB-Pyrolysis1]
name      = MX4926
elements  = C H O
massf     = 0.60957 0.10710 0.28333
p         = 1e5 4e6 6.1e6
T         = 1500 3000 500

[GPB-Pyrolysis2]
name      = MX4926-strip
elements  = C H O
massf     = 0.60957 0.10710 0.28333
p         = 1e5 4e6 6.1e6
T         = 1500 3000 500
treatment = strip
