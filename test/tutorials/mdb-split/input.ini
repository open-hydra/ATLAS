[ATLAS-Parameters]
IC-format = tec

[GPB-Phase1]
name = gas
type = ideal-gas
species = air
gamma = 1.4
mw = 28.97

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0e+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0e+4

[wall]
type = wall
q = 0.0

[ICB-Block1]
p = 1.0e+5
T = 500.0
u = 100.0

[MDB-Parameters]
ranks       = 4
prefix      = gas-
grid        = fromATLAStoSolver/gas-ic.tec
grid-out    = fromATLAStoSolver/gas-ic-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
