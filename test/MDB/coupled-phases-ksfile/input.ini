; coupled-phases with a real-fluid gas side whose wall roughness varies along x,
; read from ks-x.dat through the usual direction / *-file mechanism.
;
; With a direction key the connection is built facelet by facelet, each one
; taking the value interpolated at its own centre, so this pins the per-cell
; path (the uniform one is pinned by coupled-phases-ks) and the real-fluid
; phase.  ks-x.dat is a tent, 1.0e-5 at the ends and 1.0e-4 at x = 0.5; it
; spans more than the face on purpose: a facelet outside the file range would
; not be updated.
;
; Expected: gas 3 blocks, solid 2 blocks, 24 reciprocal interface pairs, gas 103
; records ending in the tent sampled at x = (i-1/2)/24, the solid file identical
; to the one of coupled-phases.

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = rough_connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[rough_connection]
type      = connection
direction = x
ks-file   = ks-x.dat

[T_plate]
type = wall
T = 393.0

[MDB-Parameters]
ranks       = 4
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = gas-mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
ranks    = 3
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = plate-mesh.tec
grid-out = fromATLAStoSolver/plate-mesh-split.tec
prefix   = plate-
ranks    = 2
map-file = fromATLAStoSolver/plate-decomposition.map
