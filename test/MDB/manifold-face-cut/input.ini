; The mesh of manifold-remap/ with block 1 restricted to j cuts: MDB must refuse.
;
; Block 1 is the manifold source of block 3 through its face 2. Forbidding the
; i direction makes MDB cut it along j, and face 2 is then shared by two new
; blocks. MOSE's BC_Manifold averages the state over the entire source face, so
; a 501 payload cannot name half of it: MDB refuses and says which direction
; keeps the face whole. Before the check the payload was copied raw and the
; solver averaged over one half.
;
; halo-weight is 0 so that the j cut is kept: under the default score the two
; 48 x 4 x 8 halves cost 30% ghost for 17 points of balance and MDB reverts to
; the uncut mesh, whose manifold pair then fails the rank check instead.
;
; Expected: MDB stops with status 1 naming block 1 face 2 and the direction i.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = manifold_link
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[manifold_link]
type  = manifold
block = 1
face  = 2

[MDB-Parameters]
ranks       = 2
halo-weight = 0.0
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map

[MDB-Block1]
split-directions = j
