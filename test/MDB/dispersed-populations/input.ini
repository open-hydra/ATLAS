; A dispersed phase with two materials -- alumina in two populations, water in
; one -- split for 6 ranks.
;
; A dispersed-phase BC file is not shaped like a gas one, and this case pins
; both differences:
;
;   * ATLAS BCB writes the whole boundary table once per (material, population)
;     pair, block by block, each copy carrying that population's injection data.
;     Three copies here.  MDB has to split every copy the same way and keep them
;     in that order, because the solver reads them back in it.
;   * a dispersed wall or symmetry is a bare header: write_dp_bc emits a property
;     line only under a connection, a chimera and a 401-403 inlet, where the gas
;     and solid writers emit one under the 300-series too.  Read with the gas
;     convention, every wall record swallows the next header.
;
; The phase kind is taken from the first line of drop-phase.txt, exactly as BCB
; chooses its writer; [MDB-Parameters] phase-type overrides it.
;
; Two multigrid levels on top of that: ATLAS writes a dispersed BC file per
; level, and every level carries the same three copies, so the split has to hold
; on the coarse table too -- at level 2 the blocks are 8 x 4 x 4 and the cut
; indices halve exactly.
;
; Expected: 6 blocks over 6 ranks, 3 copies of the split table at both levels.

[ATLAS-Parameters]
MG-levels = 2

[BCB-Block1]
face1 = injector
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = out
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[injector]
type = inlet
drop-gp = 345.0
drop-Tp = 450
drop-Vp = 100.0
drop-alphap = 26.0
drop-dp = 0.01
drop-sigmap = 0.0
drop-distribution = Normal

[wall]
type = wall
q = 0.0

[out]
type = outlet
p = 1.0

[MDB-Parameters]
ranks       = 6
min-cells   = 4
prefix      = drop-
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
