; One 16 x 8 x 8 block on 2 ranks whose face 3 is a melting gas-surface
; interaction (BC 503).
;
; The 503-506 records carry one property line, like 501 and 502, but MDB read
; them as bare headers until ATLAS f433f27: the property line was then taken
; for the next header and the file rejected ("cannot read a BC header"). The
; cut is along i, so every 503 record is inherited and its property line must
; be carried over unchanged, one per record, and check-bc.py must count the
; file complete.
;
; Expected: 2 pieces of 8 x 8 x 8, balance 100%, 128 records of type 503 with
; their property line.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = grain
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0
yH2 = 0.3
yO2 = 0.7

[outflow]
type = outlet
p = 9.0d+4

[grain]
type = gsi
cp = 1000.0
Ti = 300
dh = -500
T = 500
qrad = 10000
yH2 = 0.3
yO2 = 0.7

[MDB-Parameters]
ranks       = 2
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
