; The full pre-processing chain on one 32 x 12 x 8 block: BCB builds the BC
; file, ICB builds the initial field, MDB splits both for 4 ranks.
;
; The point of this case is the solution field.  MDB claims the split is exact --
; node planes on a cut are duplicated into both neighbours, cell data is
; partitioned without duplication and nothing is interpolated -- so a decomposed
; restart must carry the original field unchanged.  check-split.py verifies that
; cell by cell against gas-ic.tec, for the coordinates and for every variable.
;
; It is also the only case whose files carry a phase prefix (gas-bc.txt), which
; is what [MDB-Parameters] prefix is for.

[ATLAS-Parameters]
IC-format = tec

[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[ICB-Block1]
type = homogeneous
p = 1.0d+5
T = 500.0
u = 100.0
v = 0.0
w = 0.0

[MDB-Parameters]
ranks       = 4
prefix      = gas-
grid        = fromATLAStoSolver/gas-ic.tec
grid-out    = fromATLAStoSolver/gas-ic-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
