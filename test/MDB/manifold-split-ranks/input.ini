; The mesh of manifold-remap/ on 3 ranks: MDB must refuse.
;
; 3072 + 1024 + 1024 cells on 3 ranks cut block 1 into 12, 12 and 24 cells of
; i, and LPT then puts the piece holding face 2 of block 1 on rank 0 and block 3,
; which draws its manifold inlet from that face, on rank 2. MOSE aborts at
; start-up on such a pair (MOSE_Mod_Allocate_Data::abort_if_split: the donor
; state is not refreshed across ranks), so MDB has to say so now, with the
; decomposition in front of the user, rather than write files the solver will
; refuse. Before the check the files were written and the payload copied raw.
;
; Expected: MDB stops with status 1 naming the pair and the ranks.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = manifold_link
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[manifold_link]
type  = manifold
block = 1
face  = 2

[MDB-Parameters]
ranks       = 3
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
