; Two phases -- 24x12x1 of fluid over 24x8x1 of solid -- sharing the y = 0.05
; plane, i.e. the flat-plate conjugate-heat-transfer topology in miniature.
;
; BCB tags the shared facelets type 103 because the two blocks belong to
; different phases, and a 103 donor is numbered in *the other* phase: ATLAS
; block ids restart at 1 for every phase.  MDB must therefore resolve those
; donors against the other phase's decomposition, never its own.  Splitting a
; coupled case one phase at a time cannot do that and silently rewrites the
; interface, which is what this test exists to catch.
;
; The two phases are deliberately given different rank counts, so they are cut
; differently -- gas at i = 8,16 and solid at i = 12.  With equal counts both
; phases happen to be cut at the same indices and a donor remapped against the
; wrong phase still lands on the right cell, so the test would pass either way.
;
; Expected: gas 3 blocks, solid 2 blocks, 24 reciprocal interface pairs.

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[T_plate]
type = wall
T = 393.0

[MDB-Parameters]
ranks       = 4
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = gas-mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
ranks    = 3
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = plate-mesh.tec
grid-out = fromATLAStoSolver/plate-mesh-split.tec
prefix   = plate-
ranks    = 2
map-file = fromATLAStoSolver/plate-decomposition.map
