; The two phases of coupled-phases/ -- 24 x 12 x 1 of fluid over 24 x 8 x 1 of
; solid, different meshes -- with same-cut = true: MDB must refuse.
;
; same-cut applies one decomposition to both phases, which is only meaningful
; when they share the mesh block for block (a gas and its Eulerian condensed
; phase). Applied to a fluid over a solid it would cut the solid at the fluid's
; indices, off its own extent. MDB names the block and the two extents and
; points at same-cut = false.
;
; Expected: MDB stops with status 1 on block 1 of phase 2.

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[T_plate]
type = wall
T = 393.0

[MDB-Parameters]
ranks       = 4
same-cut    = true
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = gas-mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = plate-mesh.tec
grid-out = fromATLAStoSolver/plate-mesh-split.tec
prefix   = plate-
map-file = fromATLAStoSolver/plate-decomposition.map
