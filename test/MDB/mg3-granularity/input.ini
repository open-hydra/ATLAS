; One 44 x 16 x 8 block on 3 ranks with three multigrid levels.
;
; MOSE builds its own coarse grids by halving the block, so every cut index has
; to be a multiple of 2^(MG-levels-1) = 4 and every BC level has to be rewritten
; with the indices of that level.  44 cells is 11 granules, which does not
; divide by 3: the remainder must be spread one granule per piece, giving
; 16 + 16 + 12 cells and never a cut off the granule lattice.
;
; min-cells is lowered to 8 because the default at three levels (4 x 4 = 16)
; would leave only two admissible cuts on this small block.
;
; Expected: 3 pieces of (16, 16, 12) x 16 x 8 at 91.7% balance, with bc.txt, bc2.txt
; and bc3.txt all rewritten.

[ATLAS-Parameters]
MG-levels = 3

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 3
min-cells   = 8
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
