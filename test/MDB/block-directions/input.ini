; Two 16 x 24 x 8 blocks in a row along i, joined by a connection, on 8 ranks.
; Both have to be cut into 4, and j is the longest axis of both -- but block 1
; carries the wall, so its j direction is wall-normal and must not be cut.
;
; [MDB-Block1] split-directions = ik takes j out of the running for that block
; only:  block 1 is cut along i (4 x 24 x 8 pieces), block 2 along j
; (16 x 6 x 8 pieces).  The connection between the two is now a 4-to-4
; T-junction, which MOSE resolves per boundary cell -- the split BC file must
; rewrite every donor index accordingly.

[BCB-Block1]
face1 = inflow
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 8
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map

[MDB-Block1]
split-directions = ik
