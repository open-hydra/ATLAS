; One 32 x 12 x 8 block on 4 ranks.
;
; The block has to be cut, and the only question is along which axis.  MDB must
; take the longest admissible one -- i here -- because for a fixed number of
; cells that is the cut with the smallest new interface, and therefore the one
; that adds the fewest ghost cells.  Cutting k instead would produce the
; pancake-shaped blocks whose halo approaches their own volume.
;
; Expected: 4 pieces of 8 x 12 x 8, balance 100%, ghost overhead 37.5%.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 4
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
