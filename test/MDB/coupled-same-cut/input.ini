; A gas and a dispersed phase on the same two blocks -- the MOSE + ICE layout,
; where the coupling is volumetric, cell for cell -- split for 4 ranks with
; same-cut = true.
;
; ATLAS numbers blocks per phase and MDB decomposes each phase on its own, so
; two phases sharing a mesh could be cut differently and a cell of one would
; then sit on another rank than its twin in the other. same-cut applies the
; decomposition of phase 1 to phase 2: the same pieces get the same LPT owners,
; and the two maps are identical byte for byte. Phase 2 is read from
; drop-phase.txt, whose first line makes it dispersed: its boundary table
; carries no property line under a wall and is repeated per (material,
; population) pair, three times here, and every copy is split the same way.
;
; No [BCB-Block#] phase key: BCB associates every block with both phases.
;
; Two identical meshes under identical settings are cut identically by either
; walk today, so this fixture cannot show same-cut changing a map: it pins the
; guarantee (the same-cut line, the two maps byte for byte) and
; same-cut-mismatch/ pins the refusal of two phases that do not share the mesh.
;
; Expected: both phases 4 blocks (each 16 x 8 x 8 block cut once along i),
; balance 100%, gas-decomposition.map and drop-decomposition.map identical.

[BCB-Block1]
face1 = injector
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = out
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[injector]
type = inlet
p0 = 1.0d+5
T0 = 500.0
drop-gp = 345.0
drop-Tp = 450
drop-Vp = 100.0
drop-alphap = 26.0
drop-dp = 0.01
drop-sigmap = 0.0
drop-distribution = Normal

[wall]
type = wall
q = 0.0

[out]
type = outlet
p = 1.0

[MDB-Parameters]
ranks       = 4
same-cut    = true
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = mesh.tec
grid-out = fromATLAStoSolver/drop-mesh-split.tec
prefix   = drop-
map-file = fromATLAStoSolver/drop-decomposition.map
