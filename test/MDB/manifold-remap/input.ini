; A manifold (BC 501) survives the split: block 3 draws its inlet from face 2 of
; block 1, and block 1 is the one MDB has to cut.
;
; The 501 payload names a whole block face, not a cell: MOSE's BC_Manifold
; averages the state over the entire source face and scales the mass flux by
; the entire target face. So the payload has to be renumbered to the new block
; that inherited the source face entire -- copying it raw leaves it pointing at
; block 1, whose face 2 is now a cut -- and neither face may be cut
; tangentially. MOSE also aborts at start-up when the two blocks of a manifold
; land on different ranks (abort_if_split), which MDB checks with the same LPT
; the solver applies. check-manifold.py verifies all three against the original
; file and the map.
;
; Sizes are chosen so that both halves of block 1 and the two small blocks pair
; off: 3072 + 1024 + 1024 cells on 2 ranks cut block 1 in two, and LPT puts
; block 3 with the half that holds face 2.
;
; Expected: 4 blocks, balance 100%, the 501 payload of block 4 renumbered to
; block 2 face 2, both on rank 1.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = manifold_link
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[manifold_link]
type  = manifold
block = 1
face  = 2

[MDB-Parameters]
ranks       = 2
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
