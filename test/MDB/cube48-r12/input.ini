; One 48^3 block on 12 ranks under objective = halo.
;
; The greedy walk cuts the heaviest block along its longest axis into as many
; parts as the ideal load asks for, so it makes twelve 4 x 48 x 48 slabs: 100%
; balance bought with 91.7% ghost cells. Twelve parts also factor as 3 x 2 x 2,
; whose pieces of 16 x 24 x 24 carry the same balance for 33.3% ghost, and
; objective = halo searches every factorisation of every admissible part count
; for the best value of MDB's own score, balance / (1 + halo-weight x ghost).
; (The hand trace of the plan quoted 8.3% against 10.4% for these shapes: those
; are the numbers of a 192^3 block, four times larger; the order is the same.)
;
; greedy.ini runs the same deck under objective = balance into
; fromATLAStoSolver/greedy/, and analyse_decomp.py --assert-better is the gate:
; the searched cut must score strictly above the greedy one. That assertion is
; what turns red when the search is stubbed back to the greedy path, where a
; byte diff of the map turns red on any change at all. The map pins the cut;
; the boundary file of a 48^3 block (13824 records) is checked, not stored.
;
; Expected: 12 pieces of 16 x 24 x 24, balance 100%, ghost 33.3%, score 75.0,
; against the greedy's twelve slabs at 52.2.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 12
objective   = halo
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
