; The deck of input.ini under objective = balance, the greedy walk, written
; into fromATLAStoSolver/greedy/ from the boundary file BCB left in
; fromATLAStoSolver/, priced with the same cost.dat.

[MDB-Parameters]
ranks       = 7
objective   = balance
grid        = mesh.tec
grid-out    = fromATLAStoSolver/greedy/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/greedy/INPUT-split
map-file    = fromATLAStoSolver/greedy/decomposition.map

[MDB-Cost]
cost-file = cost.dat
