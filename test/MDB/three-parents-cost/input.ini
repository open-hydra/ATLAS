; The three blocks of three-parents/ on 7 ranks under objective = cost, with
; the coefficients of cost.dat.
;
; The cost objective prices a candidate the way a rank will pay for it: every
; interior cell, every boundary cell by its BC class, every ghost cell filled,
; and a message and its bytes for every face whose neighbour LPT put on another
; rank. It is evaluated on the ranks the solvers' own LPT on cell counts forms,
; so the search only shapes blocks whose equal cell counts carry equal work.
; cost.dat overrides the unit defaults through cost-file, the same file for
; greedy.ini, so the two maps are priced alike.
;
; The gate is check-predicted-time.py: the searched cut must predict a strictly
; lower maximum rank time than the greedy walk's slabs, which pay for more cut
; faces and more messages. With the search stubbed back to the greedy path the
; two predictions coincide and the gate fails.
;
; Face 3 of every block is a wall, and cost.dat makes a wall cell cost three
; interior cells. Under objective = halo the cube is cut 2 x 2 x 1, which leaves
; the wall to two of its four pieces; under cost it is cut 2 x 1 x 2, so that
; every piece carries a quarter of the wall: equal cells, equal work, which is
; the only way the search can lower the spread of ranks the solver forms on
; cell counts alone.
;
; Expected: 7 blocks, the cube as 2 x 1 x 2, predicted rank time (max) 4708
; against the greedy's 6884 (spread 11.5% against 39.4%).

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[MDB-Parameters]
ranks       = 7
objective   = cost
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map

[MDB-Cost]
cost-file = cost.dat
