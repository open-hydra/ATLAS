; The three blocks of three-parents/ under `MDB --sweep 4,7,12`: one table
; with the greedy walk and objective = halo at every rank count of the list,
; nothing written.
;
; This is the sweep the ICE campaign did by hand over min-cells to find a good
; cut per rank count (gen-decomp.py); the search makes that lever moot and the
; table shows, per rank count, what each walk settles on: blocks, balance,
; ghost, score, and the [MDB-Cost] model's predicted rank time and spread.
;
; Expected: at 7 ranks the search takes 7 blocks at 35.7% ghost against the
; greedy's 50%; at 4 ranks both leave the blocks whole (87.5%); at 12 the
; greedy stops at 34 blocks and the search at 22.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[MDB-Parameters]
ranks       = 7
objective   = halo
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
