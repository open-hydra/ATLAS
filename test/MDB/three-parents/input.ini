; Three unequal blocks -- a 16^3 cube, an 8 x 16 x 16 half and a 4 x 16 x 16
; quarter -- on 7 ranks under objective = halo.
;
; The parts are first apportioned to the parents by weight (4, 2 and 1), then
; each parent's share is factorised. The cube's four parts are 2 x 2 x 1 pieces
; of 8 x 8 x 16, not the four 4 x 16 x 16 slabs of the greedy walk, for the
; same 100% balance; the half is cut once along j either way. 35.7% ghost
; against the greedy's 50%.
;
; Expected: 7 blocks (four of 8 x 8 x 16, two of 8 x 8 x 16, one of
; 4 x 16 x 16), balance 100%, ghost 35.7%, score 73.7 against the greedy's 66.7.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[MDB-Parameters]
ranks       = 7
objective   = halo
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
