; The 48^3 block of cube48-r12/ on 20 ranks under objective = halo.
;
; 20 does not divide 48 along any axis, so exact balance is impossible: the
; search settles for 5 x 2 x 2, twelve pieces of 10 x 24 x 24 and eight of
; 9 x 24 x 24, at 96.0% balance and 50% ghost. It prefers that to 5 x 4 x 1,
; which balances the same and costs 58.3% ghost, and to the greedy walk, which
; slabs the block into twelve, finds them too heavy, cuts on, and stops at 56
; blocks with 111.1% ghost for the same 96.0%. (The plan's 5 x 4 x 1 at ~98.5%
; is the 192^3 answer, where 192/5 gives 39 and 38 cells.)
;
; Expected: 20 pieces, balance 96.0%, ghost 50.0%, score 64.0, against the
; greedy's 56 blocks at 45.5.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 20
objective   = halo
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
