; Three unequal blocks in a row (40, 24 and 8 cells along i) on 6 ranks.
;
; This is the trade MDB exists to get right.  Blocks are handed to ranks whole,
; so with these sizes the LPT balance stalls at 85.7% and the only way to the
; 95% target is to keep cutting -- but every cut adds two ghost layers that are
; filled and exchanged at every RK stage.  Scoring each candidate as
; balance / (1 + halo-weight * ghost) makes MDB walk down to 12 blocks, see that
; the extra 10 points of balance cost 25 points of ghost overhead, and revert to
; the 6-block decomposition it passed through on the way.
;
; This is the small version of what the SWBLI case showed at 80 ranks, where the
; balance-only search produced 592 blocks at 34.5% ghost.  balance-only/ runs
; the same mesh with halo-weight = 0 and must still produce the old, worse
; answer -- the two references are only meaningful side by side.
;
; Expected: 6 blocks, balance 85.7%, ghost 16.7%.

[BCB-Block1]
face1 = inflow
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = connection
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 6
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
