; coupled-phases with a rough fluid side: the gas connection carries a uniform
; wall roughness, ks = 1.0e-5 m.
;
; BCB still tags the shared facelets type 103.  Being a fluid (ideal-gas) phase,
; the gas writes the roughness after the connection integers of each 103
; record; the solid phase has no use for it and writes nothing.  The uniform
; value reaches every facelet through the face-level build, so this pins that
; path; MDB must then carry the value through the split unchanged.
;
; Expected: gas 3 blocks, solid 2 blocks, 24 reciprocal interface pairs, every
; gas 103 record ending in 0.100000E-04, the solid file identical to the one of
; coupled-phases.

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = rough_connection
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = connection
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[rough_connection]
type = connection
ks   = 1.0e-5

[T_plate]
type = wall
T = 393.0

[MDB-Parameters]
ranks       = 4
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = gas-mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
ranks    = 3
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = plate-mesh.tec
grid-out = fromATLAStoSolver/plate-mesh-split.tec
prefix   = plate-
ranks    = 2
map-file = fromATLAStoSolver/plate-decomposition.map
