; coupled-phases-ks with the interface found by the overset search: both sides of
; the gas/plate interface are declared chimera, the gas one with a uniform wall
; roughness, ks = 1.0e-5 m.
;
; BCB tags the interface facelets type 104 (chimera with the donors in the other
; phase) and numbers the donor blocks per phase, as the receivers and the 103
; partners.  The gas writes the roughness at the end of the donor-count line of
; each 104 record; the solid writes none.  MDB must remap the donors against the
; decomposition of the other phase and carry the roughness through the split.
;
; Expected: both decompositions as in coupled-phases, every 104 donor inside a
; block of the other phase (check-coupling.py), every gas donor-count line
; ending in 1.0000000000000001E-05.

[ATLAS-Parameters]
BC-chimera = true

[BCB-Block1]
phase = gas
face1 = inflow
face2 = ambient
face3 = rough_chimera
face4 = ambient
face5 = null
face6 = null

[BCB-Block2]
phase = plate
face1 = symmetry
face2 = symmetry
face3 = T_plate
face4 = chimera
face5 = null
face6 = null

[inflow]
type = inlet
p0   = 1.02828e5
T0   = 295.34

[ambient]
type = outlet
p  = 1.e5

[rough_chimera]
type = chimera
ks   = 1.0e-5

[T_plate]
type = wall
T = 393.0

[MDB-Parameters]
ranks       = 4
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split

[MDB-Phase1]
grid     = gas-mesh.tec
grid-out = fromATLAStoSolver/gas-mesh-split.tec
prefix   = gas-
ranks    = 3
map-file = fromATLAStoSolver/gas-decomposition.map

[MDB-Phase2]
grid     = plate-mesh.tec
grid-out = fromATLAStoSolver/plate-mesh-split.tec
prefix   = plate-
ranks    = 2
map-file = fromATLAStoSolver/plate-decomposition.map
