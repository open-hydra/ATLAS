; The mesh and rank count of halo-trade/, with halo-weight = 0.
;
; halo-weight = 0 restores the historical balance-only objective, and this test
; pins what that objective does: it keeps cutting until the 95% target is met,
; ending at 12 blocks with 96.0% balance bought at 41.7% ghost overhead -- twice
; the blocks and 2.5x the ghost cells of the 6-block answer in halo-trade/ for
; ten points of balance.  Keeping both references makes the trade visible and
; stops either branch of the score from being changed silently.
;
; Expected: 12 blocks, balance 96.0%, ghost 41.7%.

[BCB-Block1]
face1 = inflow
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = connection
face2 = connection
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = connection
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 6
halo-weight = 0.0
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
