; A manifold (BC 501) through the split. Block 3 takes its inlet from face 2 of
; block 1 through [manifold_link]; block 1 is the one MDB has to cut, and it is
; restricted to j cuts (halo-weight 0 so that the j cut is kept), so face 2 --
; the outlet of the manifold -- is shared by two new blocks, which the LPT puts
; on two ranks.
;
; The 501 payload names no block or cell: the group id, the role of the face
; (1 outlet, 2 inlet) and the parameters of the group. The solvers sum over the
; faces of a group wherever they lie, so a cut face or two ranks change nothing
; in the record: MDB copies it as it is (until 2026-11 it refused both, for the
; MOSE of 2025 that averaged one whole face from one rank). check-manifold.py
; holds the split file against the original one and the map: every 501 record
; copied verbatim from its parent cell, the same count.
;
; Expected: 4 blocks, block 1 cut along j, the 64 + 64 manifold records on three
; new blocks and two ranks, MDB exit 0.

[BCB-Block1]
face1 = inflow
face2 = manifold_link
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block2]
face1 = inflow
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[BCB-Block3]
face1 = manifold_link
face2 = outflow
face3 = symmetry
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[manifold_link]
type   = manifold
outlet = 1:2
inlet  = 3:1

[MDB-Parameters]
ranks       = 2
halo-weight = 0.0
grid        = mesh.tec
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map

[MDB-Block1]
split-directions = j
