; One 16 x 4 x 4 block on 2 ranks, its grid given to MDB as a PLOT3D file with five node planes
; (grid.p3d); BCB reads the same grid from mesh.tec. MDB must split the grid it reads as the 3D grid of
; mesh.tec: the test compares the products with those of the same deck with grid = mesh.tec.

[BCB-Block1]
face1 = inflow
face2 = outflow
face3 = wall
face4 = symmetry
face5 = symmetry
face6 = symmetry

[inflow]
type = inlet
p0 = 1.0d+5
T0 = 500.0

[outflow]
type = outlet
p = 9.0d+4

[wall]
type = wall
q = 0.0

[MDB-Parameters]
ranks       = 2
grid = grid.p3d
grid-out    = fromATLAStoSolver/mesh-split.tec
bc-path     = fromATLAStoSolver
bc-out-path = fromATLAStoSolver/INPUT-split
map-file    = fromATLAStoSolver/decomposition.map
