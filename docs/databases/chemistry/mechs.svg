<style>
.mechs { --mech-h2: #2a78d6; --mech-carbon: #eb6834; --mech-srm: #1baf7a; --mech-ring: var(--md-default-bg-color, #fff); color: inherit; font-family: inherit; }
[data-md-color-scheme="slate"] .mechs { --mech-h2: #3987e5; --mech-carbon: #d95926; --mech-srm: #199e70; }
.mechs text { font-size: 14px; fill: currentColor; }
.mechs .tick text { font-size: 15.4px; opacity: .85; }
.mechs .axis-title { font-size: 18.2px; opacity: .95; }
.mechs .grid { stroke: currentColor; stroke-width: 1; opacity: .13; }
.mechs .grid-minor { stroke: currentColor; stroke-width: 1; opacity: .06; }
.mechs .frame { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; }
.mechs .leader { stroke: currentColor; stroke-width: 1; opacity: .4; }
.mechs .f-h2 { fill: var(--mech-h2); }
.mechs .f-carbon { fill: var(--mech-carbon); }
.mechs .f-srm { fill: var(--mech-srm); }
.mechs .mk { stroke: var(--mech-ring); stroke-width: 2; paint-order: stroke; }
.mechs .pt .hit { fill: transparent; }
.mechs .pt:hover .mk { stroke: currentColor; stroke-width: 2; }
.mechs .pt:hover text { font-weight: 700; }
</style>
