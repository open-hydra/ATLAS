name: CTest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git diffutils python3 python3-pip gfortran

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: ct-env
          use-mamba: true

      - name: Build with install.sh
        run: |
          chmod +x ./install.sh
          ./install.sh build --compilers=gnu

      - name: Sanity check GPB Python deps
        shell: bash -l {0}
        run: |
          python -c "import numpy, cantera, PiNeR; print('numpy', numpy.__version__); print('cantera', cantera.__version__)"

      - name: Run tests
        env:
          ATLASDIR: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure --timeout 300

  # TecIO builds, with gnu and with Intel oneAPI (ifx, icpx), through install.sh like the job
  # above: ORION's TecIO code is compiled and libtecio is linked into ICB, BCB, MDB and STB,
  # which the job above (gnu, without TecIO) never builds. Each row runs, in RELEASE (the
  # default of install.sh), the tests that need no conda environment. Both rows are required.
  test-tecio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compilers: [gnu, intel]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git diffutils python3 gfortran

      - name: Install Intel oneAPI compilers (ifx, icpx)
        if: matrix.compilers == 'intel'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp
          source /opt/intel/oneapi/setvars.sh > /dev/null
          printenv >> "$GITHUB_ENV"

      - name: Build with install.sh (TecIO; TecIO itself is built during the configure step)
        run: |
          chmod +x ./install.sh
          ./install.sh build --compilers=${{ matrix.compilers }} --use-tecio --no-conda

      - name: Run tests
        env:
          ATLASDIR: ${{ github.workspace }}
        run: |
          ulimit -s unlimited || true
          # Every GPB-labelled test needs the GPB conda environment (cantera): the job above runs them.
          # x-variable is skipped with ifx: its RELEASE output differs from the gfortran reference
          # in the last printed digit, and the test compares it exactly.
          # IG-chimera+connection is skipped with ifx until issue #17 is settled: with ifx 2026.1 and
          # its default floating-point model one chimera weight of that case differs from the gfortran
          # reference, on main before this pull request too (with -fp-model precise it matches).
          if [ "${{ matrix.compilers }}" = intel ]; then
            ctest --test-dir build --output-on-failure --timeout 300 -LE GPB -E '^(x-variable|IG-chimera\+connection)$'
          else
            ctest --test-dir build --output-on-failure --timeout 300 -LE GPB
          fi

  # OpenMP build under AddressSanitizer and UndefinedBehaviorSanitizer (gfortran -O1 -g), with
  # floating-point traps and signalling-NaN initialisation of reals: a test fails on a heap or
  # stack overrun, on undefined behaviour, and on a floating-point exception, including one
  # raised by a real used before it is set. It runs the tests that need no conda environment
  # (the GPB-labelled tests run in the first job). The tests run single-threaded: their own
  # environment (test/CMakeLists.txt) sets OMP_NUM_THREADS=1, and CTest applies it over the
  # environment of the job.
  # - cmake is called directly because install.sh cannot pass compiler flags. FF repeats the
  #   general flags of cmake/SetFortranFlags.cmake, which adds none of its own when the three
  #   CMAKE_Fortran_FLAGS_<type> variables are given.
  # - Bounds checking is off (-fcheck=all,no-bounds): with -fcheck=bounds, gfortran 12.3 stops
  #   every test whose mesh has one or two blocks in import_nodes (src/common/grid.f90), a false
  #   positive on the component subscripts of its class(block_type) array dummy.
  # - The targets are built one at a time: programs that compile the common sources into one
  #   module directory can fail a parallel build with "Cannot rename module file".
  # - The build step runs compile_databases, a program built with these flags: detect_leaks=0 as in
  #   the test step, and UBSan stops at its first report (halt_on_error=1), so a report fails the job.
  test-omp-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git diffutils python3 gfortran

      - name: Configure (OpenMP, ASan/UBSan)
        run: |
          FF="-fno-underscoring -march=native -cpp -ffree-line-length-none -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fcheck=all,no-bounds -ffpe-trap=invalid,zero,overflow -finit-real=snan"
          cmake -S . -B build -DORION_PATH="$PWD/lib/ORION/" -DFINER_PATH="$PWD/lib/third_party/FiNeR/" -DCEA_PATH="$PWD/lib/cea/" \
            -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_CXX_COMPILER=g++ -DUSE_TECIO=false -DUSE_OPENMP=true \
            -DCMAKE_Fortran_FLAGS="$FF" -DCMAKE_Fortran_FLAGS_RELEASE=-O1 -DCMAKE_Fortran_FLAGS_DEBUG=-O1 -DCMAKE_Fortran_FLAGS_TESTING=-O1 \
            -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          for t in ORION FiNeR cea_core ICB BCB MDB STB compile_databases; do cmake --build build --target $t -j 2; done

      - name: Run tests (OpenMP build, sanitizers, single-threaded tests)
        env:
          ATLASDIR: ${{ github.workspace }}
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ulimit -s unlimited || true
          ctest --test-dir build --output-on-failure -LE GPB
