name: CTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git diffutils python3 python3-pip gfortran

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: ct-env
          use-mamba: true

      - name: Build with install.sh
        run: |
          chmod +x ./install.sh
          # Use GNU compilers and create ct-env for GPB/KAnT tests.
          ./install.sh build --compilers=gnu

      - name: Sanity check GPB Python deps
        shell: bash -l {0}
        run: |
          python -c "import numpy, cantera, PiNeR; print('numpy', numpy.__version__); print('cantera', cantera.__version__)"

      - name: Run tests
        env:
          ATLASDIR: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure --timeout 300
