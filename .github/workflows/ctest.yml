name: CTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git diffutils python3 python3-pip gfortran

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build with install.sh
        run: |
          chmod +x ./install.sh
          # Use GNU compilers, do not create Conda env in CI
          ./install.sh build --compilers=gnu

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 300
