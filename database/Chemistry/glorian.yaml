units:
  length: cm
  quantity: mol
  activation-energy: cal/mol
  time: s

phases:
- name: gas
  species: [Al, O2, AlO, M, Al2O, Al2O2, Al2O3, AlOH, AlH, AlH3, H2O, H2, CO]
  reactions: all

species:
# List all species here. Example:
- name: Al
  composition: {Al: 1}
- name: O2
  composition: {O: 2}
- name: AlO
  composition: {Al: 1, O: 1}
- name: Al2O
  composition: {Al: 2, O: 1}
- name: Al2O2
  composition: {Al: 2, O: 2}
- name: Al2O3
  composition: {Al: 2, O: 3}
- name: AlOH
  composition: {Al: 1, O: 1, H: 1}
- name: AlH
  composition: {Al: 1, H: 1}
- name: AlH3
  composition: {Al: 1, H: 3}
- name: H2O
  composition: {H: 2, O: 1}
- name: H2
  composition: {H: 2}
- name: CO
  composition: {C: 1, O: 1}

