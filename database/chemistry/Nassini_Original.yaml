description: |-
  ZND/CJ figures quoted in the original block below (CJ speed, von Neumann state, half-reaction thickness):
  verified with SDToolbox; the CJ speed and the von Neumann state also with an independent Hugoniot
  computation (D_CJ,eq 1975.44 m/s with the file thermo).
  -------------------------------------------------------------------------------
   Global mechanism for H2-air detonation
   4 species single step
   matches vN and CJ state and CJ speed over phi 0-5 (PRESHOCK atmospheric)
   matches half reaction thickness in  stoich CJ, preshock atm
   - Ea and n from the explosion theory from constant P explosions at initial P,T = 0.9 CJ state (preshock always atmospheric) varying the phi in wide range, see Bane et al 2011
   - nf and nox = 1 following Wang, but no impact on detonation profile is observed
   - A determined to match the half H2 concentration thickness in a STOICHIOMETRIC CJ, preshock atm (differences arise varying wave speed and equivalence ratio)
   - h2o formation enthalpy modified to match CJ speed over phi 0-5 in a fresh atm gas

  ================================================================
  0- Fresh gas state:
     T = 298.00 K
     p = 1.0132 bar
     rho = 0.855 kg/m3
     Molar weight = 0.0209114 kg/mol
     Gamma (frozen) = 1.400
     Sound speed in fresh gas = 407.35 m/s
  CJ wave speed = 1975.45 m/s
  Wave Mach number in fresh gas = 4.85
  1- Post-shock frozen state (von Neumann):
     T = 1537.52 K
     p = 28.1982 bar
     rho = 4.6127 kg/m3
     Molar weight = 0.0209114 kg/mol
     Gamma (frozen) = 1.318
     Sound speed = 897.59 m/s
     Speed (wave frame) = 366.24 m/s
     Speed (lab frame) = 1609.21 m/s
     Mach (wave frame) = 0.41
  2- Post-shock eq. state (CJ):
     T = 2976.57 K
     p = 15.6490 bar
     rho = 1.5232 kg/m3
     Molar weight = 0.0240888 kg/mol
     Gamma (frozen) = 1.239
     Sound speed = 1128.37 m/s
     Speed (wave frame) = 1109.09 m/s
     Speed (lab frame) = 866.36 m/s
     Mach (wave frame) = 0.98
  ***************************************************************************
  ================================================================
  Species H2ONassini (not H2O): its enthalpy of formation is the thesis value -230.66 kJ/mol, not the tabulated
  water (a species named H2O is replaced by the database record when GPB runs with reactions =); species order
  [O2, H2ONassini, H2, N2] and phase name 'Nassini' = the order and the name that the compiled FLINT routine of
  this phase expects (see docs/user/chemistry_routines.md in the FLINT repository). Deck composition keys:
  yH2ONassini.
  Thermodynamics: thesis = SanDiego coefficients + delta a7 = 1343 K (Eq. 2.46), here the NASA Glenn NASA9
  base of database/thermo/nasa9.yaml (records O2, H2ONassini, H2, N2 byte-identical to that file, the same
  records GPB uses with thermo = NASA9): max |dh| 0.02 kJ/mol below 3500 K vs SanDiego + 1343 K.

