description: |-
  -------------------------------------------------------------------------------
   Global mechanism for H2-air detonation
   4 species single step
   matches vN and CJ state and CJ speed over phi 0-5 (PRESHOCK atmospheric)
   matches half reaction thickness in  stoich CJ, preshock atm
   - Ea and n from the explosion theory from constant P explosions at initial P,T = 0.9 CJ state (preshock always atmospheric) varying the phi in wide range, see Bane et al 2011
   - nf and nox = 1 following Wang, but no impact on detonation profile is observed
   - A determined to match the half H2 concentration thickness in a STOICHIOMETRIC CJ, preshock atm (differences arise varying wave speed and equivalence ratio)
   - h2o formation enthalpy modified to match CJ speed over phi 0-5 in a fresh atm gas

