description: |-
  Frolov single-step global mechanism for H2-air detonation (4 species, 1 irreversible reaction): the formula
  published by Frolov et al., with its p^-1.15 pressure factor.

  FLINT: GPB writes the phase name 'Frolov' on line 1 of chemistry-info.txt, and FLINT selects a compiled
  routine by that name; what that routine computes, and which of the GPB tables it reads, is described in
  docs/user/chemistry_routines.md in the FLINT repository. Through GPB this file provides the species (name, order,
  molecular weights), the thermodynamic tables (including the calibrated heat release of H2OFrolov), the
  transport tables (CEApolynomials.yaml carries H2OFrolov = the water polynomials) and the rate tables, where
  the PLOG rate below is frozen at 1 atm; Cantera and KAnT use the kinetics of this file as written.

  Source: Frolov, S. M., Dubrovskii, A. V., Ivanov, V. S., "Three-dimensional numerical
  simulation of operation process in rotating detonation engine", Progress in Propulsion
  Physics 4 (2013) 467-488, doi:10.1051/eucass/201304467. Eq. (11) and the rate expression
  on p. 474.

  Model as published:
    H2 + H2 + O2 -> H2O + H2O
    [H2dot] = -8.0e11 * P^-1.15 * [H2]^2 * [O2] * exp(-10000/T)   (atm, mole, l, s)
  fitted to the ignition delays of a detailed mechanism for P = 5-40 atm, T = 1100-2000 K.

  IMPLEMENTATION NOTES
  1. The pre-exponential below is A = 4.0e11, i.e. HALF of the published 8.0e11, because
     the paper gives the rate of change of [H2] while Cantera (and the GPB rate tables) apply A
     to the reaction progress rate q, and d[H2]/dt = -2q for the stoichiometry as written.
  2. The P^-1.15 factor is expressed as a two-point PLOG: log k is linear in log P for a
     power law, so the interpolation reproduces it exactly between 1e-4 and 1e4 atm.
     Outside that interval Cantera clamps to the end values. GPB tabulates PLOG rates at
     1 atm only; for the use FLINT makes of that table under the phase name "Frolov" see
     docs/user/chemistry_routines.md in the FLINT repository.
  3. Because reaction (11) does not account for water dissociation, the paper states that
     its heat effect "was properly modified to fit the theoretical Chapman-Jouguet
     detonation velocity (~1970 m/s)". That is implemented here as species H2OFrolov, whose
     NASA7 a6 coefficient is shifted by +3792.311 K (+31531.0 J/mol) in both temperature
     ranges with respect to L5/89 H2O. Resulting dHf(298.15 K) = -210.29 kJ/mol; the
     resulting CJ velocity of the stoichiometric H2-air mixture at 298.15 K and 1 atm, with
     frozen products (no dissociation, as the irreversible step implies), is 1970.0 m/s.
     Without the shift the same computation gives 2084.0 m/s (+5.8%).
     The species is deliberately NOT named H2O: GPB overrides the thermodynamic data of a
     species by name from the database selected in the deck, which would silently discard
     the modified heat effect.
  4. The calibration is done at 1 atm, as the paper's text implies. Over the pressure range
     of the paper's own simulations the model is slow with respect to a detailed mechanism:
     -1.5% at 5 atm, -2.1% at 10 atm, -2.7% at 25 atm, -3.0% at 40 atm.
  5. The phase name must stay exactly "Frolov": GPB writes it on line 1 of chemistry-info.txt
     and FLINT selects its compiled routine by it. The species order must stay
     [O2, H2OFrolov, H2, N2], the order that routine expects.

