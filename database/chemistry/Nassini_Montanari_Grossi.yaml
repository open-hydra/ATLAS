description: |-
  Nassini 4S1R (4 species, 2 irreversible reactions): one-step H2-air detonation model of P. C. Nassini's PhD
  thesis, Chapter 2 (Eqs. 2.36-2.39, Table 2.7), Montanari-Grossi variant (forward parameters below).
  Forward (reaction 1): k_f = A exp(-Ea/RT), A = 3.1e10 dm3/(mol s), Ea/R = 11562.4 K, orders n_H2 = n_O2 = 1.
  Backward (reaction 2) = the thesis closure (Eq. 2.39), dimensionally consistent reading with p0 = 1 bar:
      k_b(T) = k_f(T) * (p0/(R T))^(n_H2 + n_O2 - 1) / K_p(T) = k_f(T) * sqrt(p0/(R T)) / K_c(T),
      K_p(T) = exp(-(g0_H2ONassini - g0_H2 - 0.5 g0_O2)/(R T)) at the standard pressure p0,
  represented EXACTLY as a Chebyshev rate in 1/T with a single pressure column (pressure independent):
  21 coefficients, max relative error <= 1.1e-4 on 200-6000 K and <= 7.3e-5 on 1000-5000 K (1 K grid) with
  respect to the closure evaluated on the thermodynamic data of THIS file.
  NASA9 only: the coefficients were computed on the NASA9 records below; with GPB thermo = NASA7 or Burcat
  the database replaces O2, H2 and N2 and the closure moves by 0.15-0.26% in 1000-5000 K: use thermo = NASA9.
  K_c convention: the closure is evaluated with Cantera's K_c, i.e. the species reference pressure 1 atm (the yaml
  carries no reference-pressure key), while the thesis states p0 = 1 bar: a K_c referred to 1 bar would lower k_b by
  0.66% (sqrt(1e5/101325)) at every T; a convention difference, not an error.
  Single pressure column; first Chebyshev reaction of the ATLAS database: GPB tabulates it as an Arrhenius
  zone (zone 2 of the Arrhenius table = the closure) and FLINT counts it as an Arrhenius reaction.
  The (1,1) orders do not move every observable towards equilibrium (T_ad kinetic 2215 K vs equilibrium
  2336 K, stoichiometric H2-air at 1 atm): a property of the one-step model, not of the closure.
  Replaces the previous two-parameter fit of the backward rate (A = 5.78089e10 1/s, Ea/R = 38821.1 K), which
  was 1-36% below Eq. 2.39 between 1000 and 5000 K (14-36% up to 4000 K). Below 200 K the polynomial is extrapolated and decreases
  monotonically to 0 (checked on GPB's default table, Tmin = 1 K).

  Thermodynamics: thesis = SanDiego coefficients + delta a7 = 1343 K (Eq. 2.46, dHf(H2O) = -230.66 kJ/mol);
  here the NASA Glenn NASA9 base of database/thermo/nasa9.yaml (records O2, H2ONassini, H2, N2 byte-identical
  to that file, the same records GPB uses with thermo = NASA9): max |dh| 0.02 kJ/mol below 3500 K vs
  SanDiego + 1343 K. Transport: Lennard-Jones data of the previous file. Deck composition keys: yH2ONassini.

  FLINT: the phase name must stay 'Nassini' and the species order [O2, H2ONassini, H2, N2]: GPB writes them
  on line 1 of chemistry-info.txt and in the tables, and FLINT selects its compiled routine by that name (see
  docs/user/chemistry_routines.md in the FLINT repository).

